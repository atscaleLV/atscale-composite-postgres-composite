unique_name: lab_sales_budget_composite
object_type: composite_model
label: Lab Sales and Budget Composite
description: >-
  Composite of the sales and budget models through their shared Lab Date
  dimension. Includes a cross-model calculation and a monthly UDA.
models:
  - lab_sales
  - lab_budget
metrics:
  - unique_name: c_sales_budget_variance
    folder: Lab Measures
aggregates:
  - unique_name: uda_monthly_sales_budget
    label: Monthly Sales and Budget
    attributes:
      - name: Month
        dimension: Lab Date
    metrics:
      - m_sales_amount_sum
      - m_budget_amount_sum
      - c_sales_budget_variance
