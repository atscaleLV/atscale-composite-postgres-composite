unique_name: lab_sales_control
object_type: model
label: Lab Sales
description: >-
  One-fact sales model using the pg_composite_control data warehouse.
relationships:
  - unique_name: lab_sales_to_date_control
    from:
      dataset: lab_fact_sales_control
      join_columns:
        - date_key
    to:
      dimension: Lab Date Control
      level: Date
metrics:
  - unique_name: m_sales_amount_sum_control
    folder: Lab Measures
