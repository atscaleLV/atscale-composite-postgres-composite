unique_name: composite_postgres_cross_repo_control
object_type: catalog
label: Composite PostgreSQL Lab - Cross-Repository Control
version: 1.8
description: >-
  Package-based composite of the independently linked Model A and Model B
  repositories. Both component models use the pg_composite_control warehouse
  so this catalog can compile and exercise the cross-model aggregate.
aggressive_agg_promotion: false
build_speculative_aggs: false
dataset_properties:
  lab_dim_date_control:
    allow_aggregates: true
    allow_local_aggs: true
    allow_peer_aggs: true
    allow_preferred_aggs: false
  lab_fact_sales_control:
    allow_aggregates: true
    allow_local_aggs: true
    allow_peer_aggs: true
    allow_preferred_aggs: false
  lab_fact_budget_control:
    allow_aggregates: true
    allow_local_aggs: true
    allow_peer_aggs: true
    allow_preferred_aggs: false
